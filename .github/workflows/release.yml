name: Release

# Publishes a release when main carries a version with no release yet: merge
# a pull request that runs scripts/bump-version.sh, and this signs,
# notarizes and publishes it with scripts/release.sh. Installed copies pick
# it up through Sparkle.
#
# The signing keys are secrets of the "release" environment, which only main
# may use (scripts/setup-release-secrets.sh sets them up). Pull request runs
# can't read them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is this version released?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      new: ${{ steps.check.outputs.new }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: Resources/Info.plist
          sparse-checkout-cone-mode: false

      - name: Compare with GitHub's releases
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import plistlib; print(plistlib.load(open("Resources/Info.plist", "rb"))["CFBundleShortVersionString"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "v$version has no release yet."
          fi

  release:
    name: Release v${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: macos-26
    environment: release
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test
        run: swift test

      - name: Install the signing identity and keys
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"

      - name: Sign, notarize and publish
        env:
          GH_TOKEN: ${{ github.token }}
          INSOMNIA_NOTARY_KEY: ${{ runner.temp }}/notary.p8
          INSOMNIA_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          INSOMNIA_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          INSOMNIA_SPARKLE_KEY_FILE: ${{ runner.temp }}/sparkle.key
        run: scripts/release.sh

      - name: Remove the signing identity and keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle.key" "$RUNNER_TEMP/id.p12"
