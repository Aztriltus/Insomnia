name: CI

# Builds and tests every pull request and every push to main.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its stale run; every commit on main
# gets its own.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Syntax-check scripts with /bin/bash 3.2
        # The recovery agent runs backstop.sh with macOS's /bin/bash 3.2, and
        # the installers run under it too.
        run: for script in scripts/*.sh; do /bin/bash -n "$script"; done

      - name: Build release
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Check the lid simulation is compiled out of the release binary
        run: scripts/check-lid-simulation-gate.sh

      - name: Test
        env:
          NSUnbufferedIO: "YES"
        run: swift test
